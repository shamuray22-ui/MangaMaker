<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria de Desenhos</title>
    <link rel="stylesheet" href="css/global-roots.css">
    <link rel="stylesheet" href="css/style.css">
    <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
</head>

<body>

    <header class="header">
        <button class="add-button" onclick="call_create_new()"> <img src="assets/icons/add.png"> Criar desenho </button>
        <button onclick="savejson()"> <img src="assets/icons/export.png"> Salvar Galeria </button>
        <button onclick="loadjson()"> <img src="assets/icons/import.png"> Carregar Galeria </button> 
        <button onclick="clearStorage()"> <img src="assets/icons/clear.png"> Limpar Galeria </button>
    
    </header>

    <main>
        <div class="scroll-draws">
            <div id="drawlist">
            </div>
        </div>
        <div id="createDiv">
            <div id="options">
                <button id="drawbtn"> <img src="assets/icons/addDraw.png"> Draw </button>
                <!-- <button id="mangaBtn"> <img src="assets/icons/addmanga.png"> Manga</button> -->
            </div>
            <div id="optionsdown">
                <button id="createFileBtn" onclick="createFile()">Criar</button>
                <button id="cancelBtn" onclick="close_create_new()">Cancelar</button>
            </div>

        </div>
    </main>
    <script src="globals/konva.min.js"></script>
    <script src="globals/localforage.min.js"></script>
    <script src="globals/globalDebug.js"></script>
    <script src="globals/globalStorage.js"></script>
    <script src="js/gallery.js"></script>

</body>

</html>
