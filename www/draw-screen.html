<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MangaMaker - Tela de Desenho</title>
  <link rel="stylesheet" href="css/global-roots.css">
  <link rel="stylesheet" href="css/draw-style.css">
</head>

<body>
  <canvas id="canvasBrush" hidden></canvas>

  <!-- Barra principal --> 

   
  <header id="toolbar">
    <button class="Generalbutton" onclick="undo()"><img src="assets/icons/undo.png" alt="Desfazer"></button>
    <button class="Generalbutton" onclick="redo()"><img src="assets/icons/redo.png" alt="Refazer"></button>
    <button class="Generalbutton" id="sairBtn" onclick="toGallery()"><img src="assets/icons/exit.png"
        alt="Sair"></button>
    <button class="Generalbutton" onclick="callSetSizeDiv()"><img src="assets/icons/resize.png"
        alt="Redimensionar"></button>
    <button class="Generalbutton" id="saveBtn" onclick="saveCanvas()"><img src="assets/icons/save.png"
        alt="Salvar"></button>
    <button class="Generalbutton" id="settingsBtn" onclick="calldefinitions()"><img src="assets/icons/settings.png"
        alt="Setting"></button>
  </header>
  <div id="pagesDiv"></div>

  <!-- Área do canvas -->
  <main id="draw-canvas"></main>

  <div id="definitionsscreen">
    <label>
      CONFIGS
    </label>
    <div>
      <label> Força de simplificação</label>
      <input id="strongSimply" type="range" min="0" step="2" value="0" max="8">
      <label> Força de Estabilizador</label>
      <input id="strongStabilizador" type="range" min="0" step="0.3" value="0.0" max="0.8">
      <label> Força de Espaçamento de textura de pincel</label>
      <input id="SpacingRange" type="range" min="0.2" step="0.2" value="0.2" max="12">

      <button class="Generalbutton" onclick="removebg()">Modo sem fundo </button>
    </div>
  </div>

  <!-- Ferramentas adicionais -->
  <div id="toolsdiv">
    <button class="Generalbutton" onclick="set_current_tool('rectangle')"><img src="assets/icons/rectangle.png"
        alt="Retângulo"></button>
    <button class="Generalbutton" onclick="set_current_tool('circle')"><img src="assets/icons/elipse.png"
        alt="Círculo"></button>
    <button class="Generalbutton" onclick="set_current_tool('line')"><img src="assets/icons/line.png"
        alt="Linha"></button>
    <button class="Generalbutton" onclick="set_current_tool('text')"><img src="assets/icons/text.png"
        alt="Texto"></button>
    <!--<button class="Generalbutton" onclick="set_current_tool('select')"><img src="assets/icons/selection.png"
        alt="Selecionar"></button> -->
  </div>

  <!-- Seleção de pincel -->
  <div id="selectBrushDiv">
    <label>Pinceis</label>
    <button class="Generalbutton" id="BrushBtn" onclick="StartBrush('assets/brush/default.png')">
      <img src='assets/brush/default.png'>
    </button>
    <button class="Generalbutton" id="BrushBtn" onclick="StartBrush('assets/brush/Xbrush.png')">
      <img src='assets/brush/Xbrush.png'>
    </button>
    <button class="Generalbutton" id="BrushBtn" onclick="StartBrush('assets/brush/tree.png')">
      <img src='assets/brush/tree.png'>
    </button>
    <button class="Generalbutton" id="BrushBtn" onclick="StartBrush('assets/brush/grass.png')">
      <img src='assets/brush/grass.png'>
    </button>
    <button class="Generalbutton" id="BrushBtn" onclick="StartBrush('assets/brush/waterSimply.png')">
      <img src='assets/brush/waterSimply.png'>
    </button>
  </div>

  <!-- Seleção de camadas -->
  <div id="layerDiv">
    <div id="layerbuttons">
      <button class="Generalbutton" onclick="addLayer()"> ADD </button>
      <label>
        <input type="file" accept=".png, .jpg" id="referenceInput">
        <img src="assets/icons/reference.png">
      </label>

      
      <button class="Generalbutton" onclick="resetRot()">
        <img src="assets/icons/restartRot.png" alt="restartRot">
      </button>
      <button class="Generalbutton" id="clearBtn" onclick="clearCanvas()"><img src="assets/icons/clear.png"
      alt="Limpar"></button>
    </div>

    <div id="layerGrid">
      
    </div>

  </div>

  <!-- Barra inferior -->
  <footer id="bottom-tools">
    <div id="ranges">
      <label>
        <input type="range" id="sizePicker" min="1" max="100" value="1">
      </label>

      <label>
          <input type="range" id="opacityPicker" min="1" max="100" value="100">
      </label>
    </div>
    <div id="buttonstools">
      <button class="Generalbutton" onclick="toggleToolsDiv()">
        <img src="assets/icons/tools.png" alt="Formas">
      </button>
      <button class="Generalbutton" onclick="set_current_tool('pen')">
        <img src="assets/icons/pen.png" alt="Caneta">
      </button>
      <button class="Generalbutton" onclick="showSelectBrushDiv()">
        <img src="assets/brush/default.png" alt="Textura">
      </button>
      <button class="Generalbutton" onclick="set_current_tool('eraser')">
        <img src="assets/icons/eraser.png" alt="Borracha">
      </button>
      <label>
        <button id="colorPicker"></button>
      </label>
      <div id="pickerContainer"></div>
      <button class="Generalbutton" onclick="showLayerListDiv()">
        <img src="assets/icons/layers.png" alt="LayerImg">
      </button>
    </div>

    <!--<button class="Generalbutton" onclick="setAutoSize()" id="autoSizeBtn">
      <img src="assets/icons/autobrush.png" alt="Auto Brush">
    </button>-->

  </footer>

  <!-- Popup de redimensionamento -->
  <section id="setSizeDiv">
    <label for="canvasWidth">Largura:</label>
    <input type="number" id="canvasWidth" value="800">

    <label for="canvasHeight">Altura:</label>
    <input type="number" id="canvasHeight" value="600">

    <button class="Generalbutton" onclick="applyCanvasSize()">Aplicar</button>
    <button class="Generalbutton" onclick="document.getElementById('setSizeDiv').style.display='none'">Cancelar</button>
  </section>

  <!-- Editor de texto -->
  <section id="textEditorDiv">
    <label for="editText">Digite seu texto:</label>
    <textarea id="editText" rows="5" cols="40"></textarea>
    <div>
      <label for="textScale">Escala:</label>
      <input type="range" id="textScale" min="12" max="120" step="1" value="12">
    </div>

    <button class="Generalbutton" onclick="saveText()">Salvar</button>
    <button class="Generalbutton" onclick="cancelEdit()">Cancelar</button>
  </section>

  <!-- Scripts -->
  <script src="globals/iro@5.js"></script>
  <script src="globals/localforage.min.js"></script>
  <script src="globals/globalDebug.js"></script>
  <script src="globals/konva.min.js"></script>
  <script src="js/configDraw-script.js"></script>
  <script src="js/KeyboardShortcuts.js"></script>
  <script src="globals/globalStorage.js"></script>
  <script src="js/draw-script.js"></script>

</body>

</html>
