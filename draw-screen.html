<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>MangaMaker - Tela de Desenho</title>
    <link rel="stylesheet" href="css/draw-style.css">
    <link rel="stylesheet" href="css/configDraw-style.css">
</head>
<body>
    <div id="toolbar">
        <label>Cor: 
            <input type="color" id="colorPicker" value="#w000000">
        </label>
        <label>Tamanho:
            <input type="range" id="sizePicker" min="1" max="30" value="1">
        </label>
        <button id="clearBtn" onclick="clearCanvas()">Limpar</button>
        <button id="saveBtn" onclick="saveCanvas()">Salvar</button>
        <button id="sairBtn" onclick="toGallery()"> Sair </button>
        <button onclick="callSetSizeDiv()"> Redimensionar Tela </button>
        <button> paginas </button>
        <div id="pagesDiv"> </div>
    </div>

    <div id="draw-canvas"></div>

    <div id="bottom-tools">
        <button onclick="set_current_tool('select')"> Selecionar </button>
        <button onclick="set_current_tool('pen')">Pen</button>
        <button onclick="set_current_tool('eraser')"> eraser </button>
        <button onclick="undo()">Undo</button>
        <button onclick="redo()">Redo</button>
        <button onclick="set_current_tool('rectangle')"> Quad </button>
        <button onclick="set_current_tool('circle')"> Circle </button>
        <button onclick="set_current_tool('line')"> Line </button>
        <button onclick="set_current_tool('text')"> Text </button>
        <button onclick="setAutoSize()" id="autoSizeBtn"> AUTO </button>
    </div>

    <div id="setSizeDiv">
        <label for="canvasWidth">Largura:</label>
        <input type="number" id="canvasWidth" value="800">
        <label for="canvasHeight">Altura:</label>
        <input type="number" id="canvasHeight" value="600">
        <button onclick="applyCanvasSize()">Aplicar</button>
        <button onclick="document.getElementById('setSizeDiv').style.display='none'">Cancelar</button>
    </div>

    <div id="textEditorDiv">
        <label for="editText">Digite seu texto:</label>
        <textarea id="editText" rows="5" cols="40"></textarea>

        <div>
            <label for="textX">Posição X:</label>
            <input type="range" id="textX" min="0" max="600">
        </div>

        <div>
            <label for="textY">Posição Y:</label>
            <input type="range" id="textY" min="0" max="800">
        </div>

        <div>
            <label for="textScale">Escala:</label>
            <input type="range" id="textScale" min="12" max="120" step="1" value="12">
        </div>

        <button onclick="saveText()">Salvar</button>
        <button onclick="cancelEdit()">Cancelar</button>
    </div>


    <script src="globals/konva.min.js"></script>
    <script src="js/draw-script.js"></script>
    <script src="js/configDraw-script.js"></script>
</body>
</html>
