<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MangaMaker - Tela de Desenho</title>
  <link rel="stylesheet" href="css/draw-style.css">
</head>
<body>

  <!-- Barra principal -->
  <header id="toolbar">
    <button class="Generalbutton" onclick="undo()"><img src="assets/icons/undo.png" alt="Desfazer"> Undo</button>
    <button class="Generalbutton" onclick="redo()"><img src="assets/icons/redo.png" alt="Refazer"> Redo</button>
    <button class="Generalbutton" id="clearBtn" onclick="clearCanvas()"><img src="assets/icons/clear.png" alt="Limpar"> Limpar</button>
    <button class="Generalbutton" id="sairBtn" onclick="toGallery()"><img src="assets/icons/exit.png" alt="Sair"> Sair</button>
    <button class="Generalbutton" onclick="callSetSizeDiv()"><img src="assets/icons/resize.png" alt="Redimensionar"> Tela</button>
    <button class="Generalbutton" id="saveBtn" onclick="saveCanvas()"><img src="assets/icons/save.png" alt="Salvar"> Salvar</button>
    <div id="pagesDiv"></div>
  </header>

  <!-- Área do canvas -->
  <main id="draw-canvas"></main>

  <!-- Ferramentas adicionais -->
  <div id="toolsdiv">
    <button class="Generalbutton" onclick="set_current_tool('rectangle')"><img src="assets/icons/rectangle.png" alt="Retângulo"> Quad</button>
    <button class="Generalbutton" onclick="set_current_tool('circle')"><img src="assets/icons/elipse.png" alt="Círculo"> Circle</button>
    <button class="Generalbutton" onclick="set_current_tool('line')"><img src="assets/icons/line.png" alt="Linha"> Line</button>
    <button class="Generalbutton" onclick="set_current_tool('text')"><img src="assets/icons/text.png" alt="Texto"> Text</button>
    <button class="Generalbutton" onclick="set_current_tool('select')"><img src="assets/icons/selection.png" alt="Selecionar"> Laço</button>
  </div>

  <!-- Seleção de pincel -->
  <div id="selectBrushDiv">
    <label> Pinceis </label>
    <button class="Generalbutton" id="BrushBtn"> brush default <img src='assets/brush/default.png'> </button>
  </div>

  <!-- Barra inferior -->
  <footer id="bottom-tools">
    <button class="Generalbutton" onclick="toggleToolsDiv()"><img src="assets/icons/tools.png" alt="Formas"> Formas</button>
    <button class="Generalbutton" onclick="set_current_tool('pen')"><img src="assets/icons/pen.png" alt="Caneta"> Pen</button>
    <button class="Generalbutton" onclick="showSelectBrushDiv()"> <img src='assets/brush/default.png'> Texure </button>
    <button class="Generalbutton" onclick="set_current_tool('eraser')"><img src="assets/icons/eraser.png" alt="Borracha"> Eraser</button>
    
    <label>
      Cor: <input type="color" id="colorPicker" value="#000000">
    </label>
    <label>
      Tamanho: <input type="range" id="sizePicker" min="1" max="30" value="1">
    </label>

    <button class="Generalbutton">Paginas list</button>
    <button class="Generalbutton" onclick="setAutoSize()" id="autoSizeBtn"><img src="assets/icons/autobrush.png" alt="Auto Brush"> AUTO</button>
  </footer>

  <!-- Popup de redimensionamento -->
  <section id="setSizeDiv">
    <label for="canvasWidth">Largura:</label>
    <input type="number" id="canvasWidth" value="800">
    
    <label for="canvasHeight">Altura:</label>
    <input type="number" id="canvasHeight" value="600">
    
    <button class="Generalbutton" onclick="applyCanvasSize()">Aplicar</button>
    <button class="Generalbutton" onclick="document.getElementById('setSizeDiv').style.display='none'">Cancelar</button>
  </section>

  <!-- Editor de texto -->
  <section id="textEditorDiv">
    <label for="editText">Digite seu texto:</label>
    <textarea id="editText" rows="5" cols="40"></textarea>
    <div>
      <label for="textScale">Escala:</label>
      <input type="range" id="textScale" min="12" max="120" step="1" value="12">
    </div>

    <button class="Generalbutton" onclick="saveText()">Salvar</button>
    <button class="Generalbutton" onclick="cancelEdit()">Cancelar</button>
  </section>

  <!-- Scripts -->
  <script src="globals/globalDebug.js"></script>
  <script src="globals/konva.min.js"></script>
  <script src="js/draw-script.js"></script>
  <script src="js/configDraw-script.js"></script>
</body>
</html>
