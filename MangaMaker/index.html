<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria de Desenhos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <h1>Minha Galeria de Desenhos</h1>
    </header>

    <main>
        <div class="gallery-controls">
            <button class="add-button" onclick="add_draw()">Adicionar Desenho</button>
        </div>

        <div id="drawing-gallery" class="gallery-container">
            <div class="drawing-card">
                <img alt="Draw 1">
                <div class="caption">Draw 1</div>
            </div>
        </div>
    </main>
    
    <footer class="footer">
        <p>&copy; 2025 Galeria de Desenhos. Todos os direitos reservados.</p>
    </footer>

    <script src="gallery.js"></script>

</body>
</html>
