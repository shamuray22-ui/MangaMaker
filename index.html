<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria de Desenhos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
    </header>

    <main>
        <div class="gallery-controls">
            <button class="add-button" onclick="add_draw()">Adicionar Desenho</button>
            <button onclick="CallcreateMangaDiv()"> Criar Manga </button>
        </div>

        <div id="drawlist">
            

        </div>

        <div id="CreateMangaDiv">
            <label>
                nome do manga:
                <input type="text">
            </label>

            <label>
                numero de paginas:
                <input type="number" id="numPages" value="1">
            </label>

            <label>
                resolução de paginas:
                X
                <input type="number" id="resPagesX" value="800">
                Y
                <input type="number" id="resPagesY" value="600">

            </label>

            <div id="pageslist">
                

            </div>

            
        </div>
    </main>

    
    <footer class="footer">
        <p>&copy; 2025 Galeria de Desenhos. Todos os direitos reservados.</p>
    </footer>

    <script src="gallery.js"></script>

</body>
</html>
