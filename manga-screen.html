<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de capítulos</title>
    <link rel="stylesheet" href="css/manga-chapters-style.css">
</head>
<body>

    <!-- Botão de adicionar capítulo -->
    <button onclick="toggleCreateChapter()">Adicionar capítulo</button>
    <button type="button" onclick="enterPreview()"> Pre vizualizar HQ </button>
    <button onclick="returnToGallery()"> Voltar para </button>
    <!-- Div de criação de capítulo -->
    <div id="create-chapter">
        <h2>Criar novo capítulo</h2>
        <label for="pages-number">Nome do capitulo:</label>
        <input type="text" id="chapter-name" placeholder="aqui fica o nome do capitulo">
        
        <label for="pages-number">Número de páginas:</label>
        <input type="number" id="pages-number" min="1" placeholder="10">
        
        <button type="button" onclick="addChapter()"">Criar capítulo</button>
    </div>

    <!-- Lista de capítulos -->
    <h1 id="emptyH1" style="color: aliceblue;"> Não se tem nada </h1>
    <div id="chapter-list">

    </div>
        
    <script src="globals/globalDebug.js"></script>
    <script src="js/manga-chapters.js"></script>

</body>
</html>
